<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <style>
    .surface { fill: #ecf2ff; }
    .ring { fill: none; stroke: #0b5fff; stroke-width: 1.5; }
    text { fill: #0b5fff; font: 700 9px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: -.7px; }
    @media (prefers-color-scheme: dark) {
      .surface { fill: #232628; }
      .ring { stroke: #3b78ff; }
      text { fill: #5e92ff; }
    }
  </style>
  <circle class="surface" cx="16" cy="16" r="14" />
  <circle class="ring" cx="16" cy="16" r="11.5" />
  <text x="16" y="19" text-anchor="middle">AC</text>
</svg>
